name: publish

# Publishing a GitHub Release vX.Y.Z publishes ccreceipt-cli@X.Y.Z to npm, with provenance.
# Authentication is npm Trusted Publishing (OIDC): no token is stored anywhere.
# One-time setup on npmjs.com: package ccreceipt-cli › Settings › Trusted publishing ›
# GitHub Actions, organization thehorizoncompany, repository ccreceipt-cli, workflow publish.yml.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Trusted Publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - name: Tag must match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm test

      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
